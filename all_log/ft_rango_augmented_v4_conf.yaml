# rango-augmented **v4** — 지금까지의 기법을 모두 합친 학습.
#
# 근거(ablation 실측): clean(올바른 정의) 33.0% vs wrong(틀린 정의) 34.0%, 같은 정리 187개
#   차이 ±0, McNemar p=1.000 → **모델이 [TYPES]/[DEFINITIONS] 를 안 읽는다.**
#   읽을 이유가 없어서다: loss 가 tactic 토큰에서만 계산되고, gold 가 destruct/induction 인
#   비율은 10.5% 뿐이라 나머지는 섹션 없이 예측된다 → 무시가 최적해.
#
# v4 가 켜는 것(전부 데이터 측 개입, 서로 직교):
#   CITE_TARGET=1     타깃 앞에 '[USES] T0(6 ctors)' 인용 → 안 읽으면 loss 상승(실질인용 91%)
#   NORMALIZE_NAMES=1 주입된 정의 이름을 α-치환 → **이름 암기 무력화**(의미보존이라 gold 유지)
#     NORMALIZE_RATE=0.5 — 전부 바꾸면 테스트(실제 이름)와 분포가 어긋나 절반만.
#   ERROR_COND=1      [ATTEMPT]/[ERROR] 섹션 → Coq 에러에서 배우게(기존 SFT엔 에러가 0건)
#   FUNC_DEFS_PATH    func_defs_v3(파일단위 인덱스 — 같은 저장소 안 동명정의 충돌 해결)
#
# 동적 검증(gold 400 예제)에서 잡은 버그 2건 — 정적 확인만으로는 못 잡았다:
#   · _LAST_INJECTED 가 조기반환 경로에서 초기화 안 돼 **이전 예제 이름이 남음**
#   · 새 이름이 goal 의 기존 변수와 **충돌**(goal 에 이미 `f, f0: float` 이 있는데 f0 를 생성)
#
# 나머지는 v2 와 동일(코퍼스·셔플·LoRA·LR·max_steps 60000·유효배치 32) → 직접 비교 가능.
model_name: deepseek-ai/deepseek-coder-1.3b-instruct
output_dir: models/rango-1.3b-augmented-v4-ft
tactic_data:
  data_loc: /tmp/coq-dataset
  sentence_db_loc: /tmp/coq-dataset/sentences.db
  shuffled_index_loc: data/ft6.7b-shuffled-index.json
  model_name: deepseek-ai/deepseek-coder-1.3b-instruct
  cache_loc: /tmp/ft-rango-aug-cache
  hard_seq_len: 4096
  formatter_conf:
    alias: general
    num_proofs: 20
    num_premises: 50
    n_step_conf:
      alias: one
    proof_ret:
      alias: sparse
      kind: bm25
      max_examples: 20
      data_loc: /tmp/coq-dataset
      sentence_db_loc: /tmp/coq-dataset/sentences.db
    premise:
      alias: sparse
      kind: tfidf
      context_format_alias: basic
      premise_format_alias: basic
      sentence_db_loc: /tmp/coq-dataset/sentences.db
      premise_filter:
        known_filter: proj-thm
  collator_conf:
    alias: proof-premise
    state_tokens: 1024
    script_tokens: 512
    proof_tokens: 1024
    premise_tokens: 512
    out_tokens: 128
hard_seq_len: 4096
example_collator:
  alias: proof-premise
  state_tokens: 1024
  script_tokens: 512
  proof_tokens: 1024
  premise_tokens: 512
  out_tokens: 128
load_in_4bit: false
bf16: true
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.001
num_train_epochs: 1
max_steps: 60000
peft_lora_r: 64
peft_lora_alpha: 16
save_steps: 1000
keep_every: 5000
save_total_limit: null
load_best_model_at_end: false
eval_steps: 5000
eval_accumulation_steps: 1
per_device_eval_batch_size: 1
num_eval_examples: 100
logging_steps: 20
gradient_checkpointing: false
dataloader_num_workers: 16
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
