# rango-augmented **v4** — 타입을 '넣는' 게 아니라 '쓰게' 만드는 학습.
#
# 배경(ablation 실측): clean(올바른 정의) 33.0% vs wrong(틀린 정의) 34.0%,
#   같은 정리 187개 차이 ±0, McNemar p=1.000 → **모델이 섹션을 안 읽는다.**
#   읽을 이유가 없어서다: `destruct v as [|x|x|x|x|x x]` 는 `val` 이라는 **이름 암기**로 낼 수 있다.
#
# v4 가 켜는 것 — 각각이 '읽지 않으면 못 푸는' 압력을 만든다:
#   NORMALIZE_NAMES=1  val→T0, Vint→C1 로 α-치환. **이름 암기가 통하지 않는다.**
#                      T0 의 생성자 수는 [TYPES] 를 읽어야만 알 수 있다. (핵심 레버)
#   CITE_TARGET=1      타깃 앞에 '[USES] T0(6 ctors)' — 읽지 않으면 loss 가 오른다
#   DISTRACTORS=2      무관한 정의를 섞는다. 안 섞으면 인용이 '하나 베끼기'라 판별 압력이 없다
#   TYPE_FACTS=1       생성자 수·인자수를 미리 계산해 명시(파싱 부담 제거)
#   FUNC_DEFS_PATH     func_defs_v3 — 파일단위 인덱스(같은 저장소 안 동명정의 충돌 해결)
#
# ★ ERROR_COND 는 뺐다. 학습 코퍼스에 .v 소스가 없어(sentences.db 텍스트만 있음)
#   Coq 실행이 불가능하고, 합성 에러는 gold 에서 역산돼 **정답이 프롬프트에 새어든다**.
#
# ★ eval_steps/num_eval_examples 를 원본 rango 와 맞췄다(500/2000).
#   근거: 원본은 val loss 최소 지점인 **checkpoint-54500** 을 배포했다(60000 은 과적합,
#   eval_loss 0.8116 → 0.8122). 우리도 최적 지점을 고를 수 있어야 공정한 비교가 된다.
model_name: deepseek-ai/deepseek-coder-1.3b-instruct
output_dir: models/rango-1.3b-augmented-v4-ft
tactic_data:
  data_loc: /tmp/coq-dataset
  sentence_db_loc: /tmp/coq-dataset/sentences.db
  shuffled_index_loc: data/ft6.7b-shuffled-index.json
  model_name: deepseek-ai/deepseek-coder-1.3b-instruct
  cache_loc: /tmp/ft-rango-aug-cache
  hard_seq_len: 4096
  formatter_conf:
    alias: general
    num_proofs: 20
    num_premises: 50
    n_step_conf:
      alias: one
    proof_ret:
      alias: sparse
      kind: bm25
      max_examples: 20
      data_loc: /tmp/coq-dataset
      sentence_db_loc: /tmp/coq-dataset/sentences.db
    premise:
      alias: sparse
      kind: tfidf
      context_format_alias: basic
      premise_format_alias: basic
      sentence_db_loc: /tmp/coq-dataset/sentences.db
      premise_filter:
        known_filter: proj-thm
  collator_conf:
    alias: proof-premise
    state_tokens: 1024
    script_tokens: 512
    proof_tokens: 1024
    premise_tokens: 512
    out_tokens: 128
hard_seq_len: 4096
example_collator:
  alias: proof-premise
  state_tokens: 1024
  script_tokens: 512
  proof_tokens: 1024
  premise_tokens: 512
  out_tokens: 128
load_in_4bit: false
bf16: true
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.001
num_train_epochs: 1
max_steps: 60000
peft_lora_r: 64
peft_lora_alpha: 16
save_steps: 1000
keep_every: 5000
save_total_limit: null
load_best_model_at_end: false
eval_steps: 500
eval_accumulation_steps: 1
per_device_eval_batch_size: 1
num_eval_examples: 2000
logging_steps: 20
gradient_checkpointing: false
dataloader_num_workers: 16
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
