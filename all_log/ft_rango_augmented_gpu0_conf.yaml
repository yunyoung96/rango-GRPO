# v1 을 **GPU0 단독**으로 이어서 돌리기 위한 conf (v2 를 GPU1 에서 동시 실행하려고 분리).
#   유효배치는 32로 동일(4 x 8 x 1GPU) — LR/스케줄/데이터 모두 기존과 같아 이어붙여도 일관됨.
model_name: deepseek-ai/deepseek-coder-1.3b-instruct
output_dir: models/rango-1.3b-augmented-ft
tactic_data:
  data_loc: /tmp/coq-dataset
  sentence_db_loc: /tmp/coq-dataset/sentences.db
  shuffled_index_loc: data/ft6.7b-shuffled-index.json
  model_name: deepseek-ai/deepseek-coder-1.3b-instruct
  cache_loc: /tmp/ft-rango-aug-cache
  hard_seq_len: 4096
  formatter_conf:
    alias: general
    num_proofs: 20
    num_premises: 50
    n_step_conf:
      alias: one
    proof_ret:
      alias: sparse
      kind: bm25
      max_examples: 20
      data_loc: /tmp/coq-dataset
      sentence_db_loc: /tmp/coq-dataset/sentences.db
    premise:
      alias: sparse
      kind: tfidf
      context_format_alias: basic
      premise_format_alias: basic
      sentence_db_loc: /tmp/coq-dataset/sentences.db
      premise_filter:
        known_filter: proj-thm
  collator_conf:
    alias: proof-premise
    state_tokens: 1024
    script_tokens: 512
    proof_tokens: 1024
    premise_tokens: 512
    out_tokens: 128
hard_seq_len: 4096
example_collator:
  alias: proof-premise
  state_tokens: 1024
  script_tokens: 512
  proof_tokens: 1024
  premise_tokens: 512
  out_tokens: 128
load_in_4bit: false
bf16: true
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 0.001
num_train_epochs: 1
max_steps: 60000
peft_lora_r: 64
peft_lora_alpha: 16
save_steps: 1000
keep_every: 5000
save_total_limit: null
load_best_model_at_end: false
eval_steps: 5000
eval_accumulation_steps: 1
per_device_eval_batch_size: 1
num_eval_examples: 100
logging_steps: 20
gradient_checkpointing: false
dataloader_num_workers: 10
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
